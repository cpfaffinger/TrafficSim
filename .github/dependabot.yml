# Monthly, grouped updates only (ADR-0015).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: monthly }
    groups: { nuget: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { npm: { patterns: ['*'] } }
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; lift together with typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /sim-core
    schedule: { interval: monthly }
    ignore:
      - dependency-name: wasm-bindgen # pinned together with wasm-bindgen-cli
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ['*'] } }
