[package]
name = "trafficsim-sim-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Deterministic microscopic traffic simulation core for TrafficSim (native + WebAssembly)."
repository = "https://github.com/cpfaffinger/TrafficSim"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Native tools (src/tools, not src/bin: the repository ignores bin/ directories).
[[bin]]
name = "batch"
path = "src/tools/batch.rs"

[[bin]]
name = "bench"
path = "src/tools/bench.rs"

[dependencies]
# Must match the wasm-bindgen-cli version used by the build (Dockerfile, CI, package.json).
wasm-bindgen = "=0.2.130"
# Network package / config parsing (exact pins, minimal features to keep the WASM small).
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
