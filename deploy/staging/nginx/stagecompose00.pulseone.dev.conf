# TrafficSim staging — host nginx behind Cloudflare (ADR-0012)
server {
	listen 80;
	server_name stagecompose00.pulseone.dev;
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 http2 ssl;
	server_name stagecompose00.pulseone.dev;

	ssl_certificate /etc/ssl/cloudflare/pulseone.dev/pulseone.dev.crt;
	ssl_certificate_key /etc/ssl/cloudflare/pulseone.dev/pulseone.dev.key;

	error_log /var/log/nginx/stagecompose00.pulseone.dev.error.log;
	access_log /var/log/nginx/stagecompose00.pulseone.dev.access.log;

	client_max_body_size 50m;

	gzip on;
	gzip_proxied any;
	gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

	location / {
		proxy_pass http://127.0.0.1:28100;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 300;
		proxy_send_timeout 300;
	}
}
