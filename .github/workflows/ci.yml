# Lean CI (ADR-0015): standard runners only, path-filtered jobs, cancel superseded runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Runs on main are never cancelled: path filters compare each
# push with its predecessor, so a cancelled run would leave that commit's changes untested.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WASM_BINDGEN_VERSION: 0.2.130
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      simcore: ${{ steps.filter.outputs.simcore }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On main, diff against the last commit with green CI (not the direct predecessor): changes of a
      # failed commit are re-tested by every following push until CI is green again. Staging CD only
      # checks the head commit, so this keeps untested code from being deployed.
      - name: Determine diff base
        id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            sha=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "diff base: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            simcore:
              - 'sim-core/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'sim-core/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose*.yaml'
              - 'backend/**/*.csproj'
              - 'backend/*.props'
              - 'backend/global.json'
              - 'frontend/package*.json'
              - 'sim-core/Cargo.*'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj', 'backend/*.props') }}
          restore-keys: nuget-
      - name: Test with coverage
        run: dotnet test --solution TrafficSim.slnx -c Release --coverage --coverage-output-format cobertura --coverage-settings coverage.settings.xml
      - name: Merge coverage and enforce threshold (85 % lines)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null
          reportgenerator -reports:'TestResults/*.cobertura.xml' -targetdir:coverage -reporttypes:'Cobertura;MarkdownSummaryGithub;TextSummary'
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage/Summary.txt
          python3 - <<'PY'
          import re, sys
          rate = float(re.search(r'line-rate="([0-9.]+)"', open('coverage/Cobertura.xml').read()).group(1))
          print(f"line coverage {rate:.1%}")
          sys.exit(0 if rate >= 0.85 else 1)
          PY

  sim-core:
    needs: changes
    if: needs.changes.outputs.simcore == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sim-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test with coverage (85 % lines)
        run: |
          cargo llvm-cov --fail-under-lines 85 --summary-only | tee coverage.txt
          { echo '### sim-core coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-core
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:wasm
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
