name: Bug
description: Something does not work as expected
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (scenario, seed, area)
  - type: input
    id: version
    attributes:
      label: Version / commit (see app status panel)
