# TrafficSim — one Compose project, one published HTTP port, bind-mounted data (ADR-0012).
name: trafficsim

services:
  app:
    image: trafficsim-app:${TRAFFICSIM_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TRAFFICSIM_BIND:-127.0.0.1}:${TRAFFICSIM_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__TrafficSim: "Host=db;Port=5432;Database=${POSTGRES_DB:-trafficsim};Username=${POSTGRES_USER:-trafficsim};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Providers__Contact: ${TRAFFICSIM_CONTACT:-https://github.com/cpfaffinger/TrafficSim}
      Providers__Photon__BaseUrl: ${PHOTON_BASE_URL:-https://photon.komoot.io/}
      Providers__Cache__Directory: /data/cache
      Providers__Geofabrik__Directory: /data/osm
      Providers__Google__Enabled: ${GOOGLE_MAPS_ENABLED:-false}
      Providers__Google__ApiKey: ${GOOGLE_MAPS_API_KEY:-}
      Providers__TerrainTiles__Enabled: ${TERRAIN_TILES_ENABLED:-true}
    volumes:
      - ./data/cache:/data/cache
      - ./data/osm:/data/osm
    deploy:
      resources:
        limits:
          memory: 1g

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trafficsim}
      POSTGRES_USER: ${POSTGRES_USER:-trafficsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 1g

  # Optional self-hosted Photon (ADR-0004): `docker compose --profile photon up -d`, then set
  # PHOTON_BASE_URL=http://photon:2322/ in .env. Downloads a country index on first start.
  photon:
    profiles: [photon]
    build:
      context: deploy/photon
      args:
        PHOTON_VERSION: ${PHOTON_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      PHOTON_DATA_URL: ${PHOTON_DATA_URL:-https://download1.graphhopper.com/public/extracts/by-country-code/at/photon-db-at-latest.tar.bz2}
    volumes:
      - ./data/photon:/photon/data
    deploy:
      resources:
        limits:
          memory: 2g
